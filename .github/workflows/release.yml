{"name":"Release App","on":{"push":{"tags":["v*"]},"workflow_dispatch":null},"permissions":{"contents":"write"},"concurrency":{"group":"build-${{ github.ref }}","cancel-in-progress":false},"jobs":{"test":{"name":"Test (Compile Check)","runs-on":"ubuntu-latest","steps":[{"name":"Checkout Source Code","uses":"actions/checkout@v4"},{"name":"Set up Python 3.11","uses":"actions/setup-python@v5","with":{"python-version":"3.11","cache":"pip"}},{"name":"Install Python Dependencies","run":"python -m pip install --upgrade pip\npip install -r requirements.txt\n"},{"name":"Compile Check (py_compile)","run":"python -m compileall -q .\n"}]},"build":{"name":"Build (${{ matrix.os }})","needs":"test","runs-on":"${{ matrix.os }}","strategy":{"fail-fast":false,"matrix":{"include":[{"os":"ubuntu-latest","artifact_name":"auto-caption-linux","ffmpeg_dir":"bin/ffmpeg_linux","target_binary":"auto-caption-generator"},{"os":"windows-latest","artifact_name":"auto-caption-windows","ffmpeg_dir":"bin/ffmpeg_windows","target_binary":"auto-caption-generator.exe"}]}},"steps":[{"name":"Checkout Source Code","uses":"actions/checkout@v4"},{"name":"Set up Python 3.11","uses":"actions/setup-python@v5","with":{"python-version":"3.11","cache":"pip"}},{"name":"Install System Dependencies (Ubuntu)","if":"runner.os == 'Linux'","run":"sudo apt-get update\nsudo apt-get install -y libegl1 libgl1 libxkbcommon0\n"},{"name":"Install Python Dependencies","run":"python -m pip install --upgrade pip\npip install -r requirements.txt\npip install pyinstaller\n"},{"name":"Cache Whisper Model (faster-whisper-base)","id":"cache-whisper-model","uses":"actions/cache@v4","with":{"path":"assets/models/faster-whisper-base","key":"faster-whisper-base-${{ runner.os }}"}},{"name":"Download Whisper Model (faster-whisper-base)","if":"steps.cache-whisper-model.outputs.cache-hit != 'true'","shell":"bash","run":"python -c \"\nfrom faster_whisper import download_model\nimport shutil\nfrom pathlib import Path\n\ntarget_dir = Path('assets/models/faster-whisper-base')\ntarget_dir.parent.mkdir(parents=True, exist_ok=True)\n\nprint('Mengunduh model base via faster_whisper API...')\ndownloaded_path = download_model('base', output_dir=str(target_dir))\nprint(f'Model berhasil diunduh ke:{target_dir}')\n\"\n"},{"name":"Download FFmpeg Static Binary (Linux)","if":"runner.os == 'Linux'","run":"set -euo pipefail\nmkdir -p bin/ffmpeg_linux\nurl=\"https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz\"\nwget --retry-connrefused --waitretry=5 --tries=3 -O ffmpeg.tar.xz \"$url\"\n\n# Validasi:pastikan yang ke-download benar-benar binary, bukan halaman error\nfileSize=$(stat -c%s ffmpeg.tar.xz)\nif [ \"$fileSize\" -lt 1000000 ]; then\n  echo \"Download gagal atau file tidak valid (ukuran cuma $fileSize bytes). Kemungkinan URL asset sudah berubah.\"\n  head -c 500 ffmpeg.tar.xz\n  exit 1\nfi\necho \"FFmpeg berhasil didownload:$fileSize bytes\"\n\ntar -xf ffmpeg.tar.xz\nFFMPEG_DIR=$(find . -maxdepth 1 -type d -name \"ffmpeg-n8.1-latest-linux64-gpl-8.1\")\ncp \"$FFMPEG_DIR/bin/ffmpeg\" bin/ffmpeg_linux/ffmpeg\nchmod +x bin/ffmpeg_linux/ffmpeg\nrm -rf ffmpeg.tar.xz ffmpeg-n8.1-latest-linux64-gpl-8.1\n"},{"name":"Download FFmpeg Static Binary (Windows)","if":"runner.os == 'Windows'","shell":"pwsh","run":"New-Item -ItemType Directory -Force -Path bin/ffmpeg_windows\n$url = \"https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip\"\nInvoke-WebRequest -Uri $url -OutFile \"ffmpeg.zip\" -MaximumRetryCount 3 -RetryIntervalSec 10\n\n# Validasi:pastikan yang ke-download benar-benar binary, bukan halaman error HTML\n$fileSize = (Get-Item \"ffmpeg.zip\").Length\nif ($fileSize -lt 1MB) {\n  Write-Error \"Download gagal atau file tidak valid (ukuran cuma $fileSize bytes). Kemungkinan URL asset sudah berubah.\"\n  Get-Content \"ffmpeg.zip\" -TotalCount 5  # tampilkan isi file untuk debug\n  exit 1\n}\nWrite-Host \"FFmpeg berhasil didownload:$fileSize bytes\"\n\nExpand-Archive -Path \"ffmpeg.zip\" -DestinationPath \"ffmpeg_extracted\"\n$ffmpegExe = Get-ChildItem -Path \"ffmpeg_extracted\" -Filter \"ffmpeg.exe\" -Recurse | Select-Object -First 1\nCopy-Item -Path $ffmpegExe.FullName -Destination \"bin/ffmpeg_windows/ffmpeg.exe\"\nRemove-Item -Recurse -Force \"ffmpeg_extracted\", \"ffmpeg.zip\"\n"},{"name":"Build Executable via PyInstaller","shell":"bash","run":"pyinstaller -y --clean auto_caption_generator.spec\n"},{"name":"Upload Build Artifacts","uses":"actions/upload-artifact@v4","with":{"name":"${{ matrix.artifact_name }}","path":"dist/auto-caption-generator/","retention-days":14}}]},"release":{"name":"Create GitHub Release","needs":"build","if":"startsWith(github.ref, 'refs/tags/v')","runs-on":"ubuntu-latest","steps":[{"name":"Download Linux Build Artifact","uses":"actions/download-artifact@v4","with":{"name":"auto-caption-linux","path":"release-linux/"}},{"name":"Download Windows Build Artifact","uses":"actions/download-artifact@v4","with":{"name":"auto-caption-windows","path":"release-windows/"}},{"name":"Zip Linux Build","run":"cd release-linux\nzip -r ../auto-caption-generator-linux-${{ github.ref_name }}.zip .\ncd ..\n"},{"name":"Zip Windows Build","run":"cd release-windows\nzip -r ../auto-caption-generator-windows-${{ github.ref_name }}.zip .\ncd ..\n"},{"name":"Create Release","uses":"softprops/action-gh-release@v2","with":{"files":"auto-caption-generator-linux-${{ github.ref_name }}.zip\nauto-caption-generator-windows-${{ github.ref_name }}.zip\n","generate_release_notes":true}}]}}}