name: Build and Package Desktop App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: auto-caption-linux
            ffmpeg_dir: bin/ffmpeg_linux
            target_binary: auto-caption-generator
          - os: windows-latest
            artifact_name: auto-caption-windows
            ffmpeg_dir: bin/ffmpeg_windows
            target_binary: auto-caption-generator.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download Whisper Model (faster-whisper-base)
        shell: bash
        run: |
          python -c "
          from faster_whisper import download_model
          import shutil
          from pathlib import Path

          target_dir = Path('assets/models/faster-whisper-base')
          target_dir.parent.mkdir(parents=True, exist_ok=True)

          print('Mengunduh model base via faster_whisper API...')
          downloaded_path = download_model('base', output_dir=str(target_dir))
          print(f'Model berhasil diunduh ke: {target_dir}')
          "

      - name: Download FFmpeg Static Binary (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p bin/ffmpeg_linux
          wget https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
          tar -xf ffmpeg-release-amd64-static.tar.xz
          cp ffmpeg-*-amd64-static/ffmpeg bin/ffmpeg_linux/ffmpeg
          chmod +x bin/ffmpeg_linux/ffmpeg
          rm -rf ffmpeg-*-amd64-static*

      - name: Download FFmpeg Static Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin/ffmpeg_windows
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile "ffmpeg.zip" -MaximumRetryCount 3 -RetryIntervalSec 10
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item -Path $ffmpegExe.FullName -Destination "bin/ffmpeg_windows/ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg_extracted", "ffmpeg.zip"

      - name: Build Executable via PyInstaller
        shell: bash
        run: |
          pyinstaller -y --clean auto_caption_generator.spec

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/auto-caption-generator/
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: lyric-app-linux
          path: release-linux/

      - name: Download Windows Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: lyric-app-windows
          path: release-windows/

      - name: Zip Linux Build
        run: |
          cd release-linux
          zip -r ../lyric-green-screen-linux-${{ github.ref_name }}.zip .
          cd ..

      - name: Zip Windows Build
        run: |
          cd release-windows
          zip -r ../lyric-green-screen-windows-${{ github.ref_name }}.zip .
          cd ..

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lyric-green-screen-linux-${{ github.ref_name }}.zip
            lyric-green-screen-windows-${{ github.ref_name }}.zip
          generate_release_notes: true